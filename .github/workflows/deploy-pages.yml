name: Deploy game to Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w @pixel-horde/admin
      # Skipped until the owner adds the two repo secrets (see docs/deploy.md).
      # `main` becomes the production deploy; every other branch gets a preview URL.
      - name: Create Pages project (first run only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler pages project create pixel-horde --production-branch=main || true
          npx wrangler pages project create pixel-horde-admin --production-branch=main || true
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler pages deploy apps/game/dist --project-name=pixel-horde --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}"
          npx wrangler pages deploy apps/admin/dist --project-name=pixel-horde-admin --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}"
